<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="904" viewBox="0 0 1080 904" fill="none" role="img" aria-labelledby="title description">
  <title id="title">DMAS — interactive session command reference</title>
  <desc id="description">Twelve commands in seven groups: load a file; hint for the next Socratic rung; challenge for a predict-then-run task; why, code, and report for evidence, marked source, and the full report; retry to re-read an edited file and compare attempts; mastery and progress to inspect learning and attempts; concept, problems, and problem to explore the curriculum and pin a task. The complete, copyable command reference appears below this illustration.</desc>
  <defs>
    <linearGradient id="frame" x1="8" y1="8" x2="1072" y2="896" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111c30"/>
      <stop offset="0.48" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#101c2c"/>
    </linearGradient>
    <linearGradient id="border" x1="8" y1="8" x2="1072" y2="896" gradientUnits="userSpaceOnUse">
      <stop stop-color="#527a98"/>
      <stop offset="0.4" stop-color="#28354c"/>
      <stop offset="1" stop-color="#386958"/>
    </linearGradient>
    <linearGradient id="header" x1="8" y1="8" x2="1072" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b2940"/>
      <stop offset="1" stop-color="#142336"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="table-clip">
      <rect x="44" y="135" width="992" height="733" rx="14"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1064" height="888" rx="22" fill="url(#frame)" stroke="url(#border)" stroke-width="1.5"/>
  <path d="M30 9H1050A21 21 0 0 1 1071 30V72H9V30A21 21 0 0 1 30 9Z" fill="url(#header)"/>
  <ellipse cx="910" cy="120" rx="250" ry="180" fill="url(#ambient)"/>
  <path d="M9 72H1071" stroke="#2b3b53"/>
  <circle cx="38" cy="40" r="6" fill="#ff6b7a"/>
  <circle cx="59" cy="40" r="6" fill="#ffd166"/>
  <circle cx="80" cy="40" r="6" fill="#5ee0a0"/>
  <path d="m112 34 7 6-7 6m12 0h9" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="147" y="46" fill="#f0f6ff" font-size="18" font-weight="700" letter-spacing="1.5">DMAS</text>
    <text x="212" y="46" fill="#6e839f" font-size="18">/</text>
    <text x="231" y="46" fill="#b4c4db" font-size="17">commands</text>
    <rect x="845" y="25" width="191" height="30" rx="15" fill="#12313a" stroke="#255260"/>
    <circle cx="863" cy="40" r="3.5" fill="#5eead4"/>
    <text x="876" y="44" fill="#99f6e4" font-size="11" font-weight="600" letter-spacing="0.9">COMMAND REFERENCE</text>
    <text x="44" y="109" fill="#a8bdd7" font-size="12" font-weight="600" letter-spacing="2.2">SESSION COMMANDS</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="1036" y="109" text-anchor="end" fill="#7f96b4" font-size="13"><tspan fill="#67e8f9">12</tspan> commands <tspan fill="#4d6688">·</tspan> <tspan fill="#c4b5fd">7</tspan> groups</text>

    <rect x="44" y="135" width="992" height="733" rx="14" fill="#142035" filter="url(#shadow)"/>
    <g clip-path="url(#table-clip)">
      <rect x="44" y="184" width="992" height="124" fill="#142638"/>
      <rect x="44" y="308" width="992" height="78" fill="#1b2034"/>
      <rect x="44" y="386" width="992" height="91" fill="#162b3b"/>
      <rect x="44" y="477" width="992" height="90" fill="#19253c"/>
      <rect x="44" y="567" width="992" height="91" fill="#142b2e"/>
      <rect x="44" y="658" width="992" height="91" fill="#21233b"/>
      <rect x="44" y="749" width="992" height="119" fill="#162b32"/>
    </g>
    <rect x="44" y="135" width="992" height="733" rx="14" stroke="#34465f"/>
    <path d="M44 184H1036M44 308H1036M44 386H1036M44 477H1036M44 567H1036M44 658H1036M44 749H1036" stroke="#2b3c54"/>
    <path d="M355 151V851" stroke="#3a4d68" stroke-opacity="0.55"/>
    <text x="72" y="166" fill="#a8bdd7" font-size="12" font-weight="600" letter-spacing="1.8">COMMAND</text>
    <text x="382" y="166" fill="#a8bdd7" font-size="12" font-weight="600" letter-spacing="1.8">WHAT IT DOES</text>

    <rect x="44" y="204" width="3" height="84" rx="1.5" fill="#67e8f9"/>
    <rect x="72" y="228" width="195" height="34" rx="8" fill="#163a49" stroke="#2d6475"/>
    <text x="88" y="250" fill="#a5f3fc" font-size="17" font-weight="600">load <tspan fill="#8fc5d7" font-weight="400">&lt;file&gt;</tspan></text>
    <text x="382" y="222" fill="#d8e3f3" font-size="16">
      <tspan x="382">read a file; the task is detected from the function it</tspan>
      <tspan x="382" dy="24">defines, or falls back to structural findings for a file</tspan>
      <tspan x="382" dy="24">the tutor has no reference for</tspan>
    </text>

    <rect x="44" y="326" width="3" height="42" rx="1.5" fill="#a78bfa"/>
    <rect x="72" y="330" width="92" height="34" rx="8" fill="#30264c" stroke="#5b4884"/>
    <text x="88" y="352" fill="#d8c5ff" font-size="17" font-weight="600">hint</text>
    <text x="382" y="353" fill="#d8e3f3" font-size="16">the next rung, and only the next rung</text>

    <rect x="44" y="404" width="3" height="55" rx="1.5" fill="#38bdf8"/>
    <rect x="72" y="414" width="146" height="34" rx="8" fill="#183c53" stroke="#346786"/>
    <text x="88" y="436" fill="#a5e4ff" font-size="17" font-weight="600">challenge</text>
    <text x="382" y="425" fill="#d8e3f3" font-size="16">
      <tspan x="382">a predict-then-run task built from the minimal</tspan>
      <tspan x="382" dy="24">failing input</tspan>
    </text>

    <rect x="44" y="495" width="3" height="54" rx="1.5" fill="#fbbf24"/>
    <rect x="72" y="505" width="64" height="34" rx="8" fill="#3a2c19" stroke="#705629"/>
    <text x="104" y="527" text-anchor="middle" fill="#fcd878" font-size="17" font-weight="600">why</text>
    <rect x="147" y="505" width="76" height="34" rx="8" fill="#18344b" stroke="#315c7a"/>
    <text x="185" y="527" text-anchor="middle" fill="#a5e4ff" font-size="17" font-weight="600">code</text>
    <rect x="234" y="505" width="94" height="34" rx="8" fill="#30264c" stroke="#5b4884"/>
    <text x="281" y="527" text-anchor="middle" fill="#d8c5ff" font-size="17" font-weight="600">report</text>
    <text x="382" y="528" fill="#d8e3f3" font-size="16">the evidence, the marked source, the full report</text>

    <rect x="44" y="585" width="3" height="55" rx="1.5" fill="#5eead4"/>
    <rect x="72" y="595" width="108" height="34" rx="8" fill="#164339" stroke="#327464"/>
    <text x="88" y="617" fill="#99f6e4" font-size="17" font-weight="600">retry</text>
    <text x="382" y="606" fill="#d8e3f3" font-size="16">
      <tspan x="382">re-read the file after you edit it, and diff the two</tspan>
      <tspan x="382" dy="24">attempts</tspan>
    </text>

    <rect x="44" y="676" width="3" height="55" rx="1.5" fill="#c4b5fd"/>
    <rect x="72" y="686" width="110" height="34" rx="8" fill="#30264c" stroke="#5b4884"/>
    <text x="127" y="708" text-anchor="middle" fill="#d8c5ff" font-size="17" font-weight="600">mastery</text>
    <rect x="196" y="686" width="132" height="34" rx="8" fill="#173a39" stroke="#30635c"/>
    <text x="262" y="708" text-anchor="middle" fill="#99f6e4" font-size="17" font-weight="600">progress</text>
    <text x="382" y="697" fill="#d8e3f3" font-size="16">
      <tspan x="382">what the session believes you have mastered;</tspan>
      <tspan x="382" dy="24">every attempt so far</tspan>
    </text>

    <rect x="44" y="767" width="3" height="83" rx="1.5" fill="#93c5fd"/>
    <rect x="72" y="769" width="256" height="34" rx="8" fill="#30264c" stroke="#5b4884"/>
    <text x="88" y="791" fill="#d8c5ff" font-size="17" font-weight="600">concept <tspan fill="#b4a9ce" font-weight="400">[&lt;id&gt;]</tspan></text>
    <rect x="72" y="815" width="112" height="34" rx="8" fill="#18344b" stroke="#315c7a"/>
    <text x="128" y="837" text-anchor="middle" fill="#a5e4ff" font-size="16" font-weight="600">problems</text>
    <rect x="197" y="815" width="131" height="34" rx="8" fill="#163c39" stroke="#30635c"/>
    <text x="208" y="837" fill="#99f6e4" font-size="15" font-weight="600">problem <tspan fill="#8cbfb8" font-weight="400">&lt;id&gt;</tspan></text>
    <text x="382" y="814" fill="#d8e3f3" font-size="16">explore the curriculum; pin a task</text>
  </g>
</svg>
