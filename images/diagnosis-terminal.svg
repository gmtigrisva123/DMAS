<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1442" viewBox="0 0 1080 1442" fill="none" role="img" aria-labelledby="title description">
  <title id="title">DMAS — cognitive diagnosis, graph alignment, and Socratic intervention</title>
  <desc id="description">A report for Mixed interval conventions, misconception bs.interval-convention-mismatch, belief 0.77, severity MAJOR, line 4. Dynamic and static evidence identify the flawed belief about the upper bound. Knowledge-graph alignment identifies Loop invariants, concept loop-invariant at depth 4, and a learning path through Half-open intervals to Boundary conditions. Cognitive intervention targets Loop invariants with success probability 61 percent, inside the zone of proximal development, and three Socratic questions: orienting, contradiction, and conceptual. Answer leakage is 0.00 and grounding is 0.55. The complete, copyable report appears below this illustration.</desc>
  <defs>
    <linearGradient id="frame" x1="8" y1="8" x2="1072" y2="1434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111c30"/>
      <stop offset="0.48" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#101c2c"/>
    </linearGradient>
    <linearGradient id="border" x1="8" y1="8" x2="1072" y2="1434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#527a98"/>
      <stop offset="0.4" stop-color="#28354c"/>
      <stop offset="1" stop-color="#386958"/>
    </linearGradient>
    <linearGradient id="header" x1="8" y1="8" x2="1072" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b2940"/>
      <stop offset="1" stop-color="#142336"/>
    </linearGradient>
    <linearGradient id="card" x1="44" y1="0" x2="1036" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#162136"/>
      <stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <linearGradient id="intervention" x1="44" y1="822" x2="1036" y2="1414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12252c"/>
      <stop offset="1" stop-color="#101c2b"/>
    </linearGradient>
    <linearGradient id="belief" x1="824" y1="0" x2="929" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1064" height="1426" rx="22" fill="url(#frame)" stroke="url(#border)" stroke-width="1.5"/>
  <path d="M30 9H1050A21 21 0 0 1 1071 30V72H9V30A21 21 0 0 1 30 9Z" fill="url(#header)"/>
  <ellipse cx="910" cy="120" rx="250" ry="180" fill="url(#ambient)"/>
  <path d="M9 72H1071" stroke="#2b3b53"/>
  <circle cx="38" cy="40" r="6" fill="#ff6b7a"/>
  <circle cx="59" cy="40" r="6" fill="#ffd166"/>
  <circle cx="80" cy="40" r="6" fill="#5ee0a0"/>
  <path d="m112 34 7 6-7 6m12 0h9" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="147" y="46" fill="#f0f6ff" font-size="18" font-weight="700" letter-spacing="1.5">DMAS</text>
    <text x="212" y="46" fill="#6e839f" font-size="18">/</text>
    <text x="231" y="46" fill="#b4c4db" font-size="17">report</text>
    <rect x="845" y="25" width="191" height="30" rx="15" fill="#12313a" stroke="#255260"/>
    <circle cx="863" cy="40" r="3.5" fill="#5eead4"/>
    <text x="876" y="44" fill="#99f6e4" font-size="11" font-weight="600" letter-spacing="0.7">GROUNDED · SOCRATIC</text>
    <text x="44" y="109" fill="#a8bdd7" font-size="12" font-weight="600" letter-spacing="2.2">DIAGNOSING THE BELIEF, NOT THE BUG</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="1036" y="109" text-anchor="end" fill="#7f96b4" font-size="13"><tspan fill="#fcd878">evidence</tspan><tspan fill="#4d6688"> → </tspan><tspan fill="#93c5fd">prerequisite</tspan><tspan fill="#4d6688"> → </tspan><tspan fill="#99f6e4">question</tspan></text>

    <rect x="44" y="135" width="992" height="400" rx="14" fill="url(#card)" stroke="#51452f" filter="url(#shadow)"/>
    <rect x="44" y="157" width="3" height="356" rx="1.5" fill="#fbbf24"/>
    <rect x="72" y="153" width="36" height="30" rx="7" fill="#3a2c19" stroke="#705629"/>
    <text x="90" y="173" text-anchor="middle" fill="#fcd878" font-size="15" font-weight="700">01</text>
    <text x="126" y="175" fill="#f5dcab" font-size="20" font-weight="600">Cognitive diagnosis</text>
    <rect x="854" y="153" width="84" height="30" rx="7" fill="#3a2c19" stroke="#705629"/>
    <text x="896" y="173" text-anchor="middle" fill="#fcd878" font-size="14" font-weight="700" letter-spacing="0.7">MAJOR</text>
    <rect x="950" y="153" width="58" height="30" rx="7" fill="#233149" stroke="#3c506d"/>
    <text x="979" y="173" text-anchor="middle" fill="#b5cef1" font-size="15">L4</text>
    <path d="M72 196H1008" stroke="#344057"/>
    <text x="72" y="222" fill="#8da5c5" font-size="13">misconception</text>
    <text x="440" y="222" fill="#8da5c5" font-size="13">name</text>
    <text x="824" y="222" fill="#8da5c5" font-size="13">belief</text>
    <text x="72" y="249" fill="#c4b5fd" font-size="16">bs.interval-convention-mismatch</text>
    <text x="440" y="249" fill="#f5dcab" font-size="18" font-weight="600">Mixed interval conventions</text>
    <rect x="824" y="240" width="105" height="8" rx="4" fill="#34352f"/>
    <rect x="824" y="240" width="80.85" height="8" rx="4" fill="url(#belief)"/>
    <text x="1008" y="249" text-anchor="end" fill="#fcd878" font-size="18" font-weight="700">0.77</text>

    <rect x="72" y="272" width="936" height="79" rx="9" fill="#28261f" stroke="#534732"/>
    <path d="M73 285V338" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <text x="92" y="295" fill="#d4b77e" font-size="13">The flawed belief</text>
    <text x="92" y="319" fill="#f1e3ca" font-size="17">
      <tspan x="92">"I think the upper bound is just 'the end of the array'</tspan>
      <tspan x="92" dy="23">— which end does not matter."</tspan>
    </text>
    <text x="72" y="386" fill="#a7bad4" font-size="15">why:</text>
    <rect x="72" y="405" width="114" height="25" rx="6" fill="#173544" stroke="#2d5b6d"/>
    <text x="129" y="422" text-anchor="middle" fill="#99e6f7" font-size="13">[dynamic]</text>
    <text x="204" y="423" fill="#d8e3f3" font-size="16">execution first diverges at <tspan fill="#fde68a">line 4</tspan>, the same line this rule flags</text>
    <rect x="72" y="451" width="114" height="25" rx="6" fill="#2e254a" stroke="#55447d"/>
    <text x="129" y="468" text-anchor="middle" fill="#d8c5ff" font-size="13">[static]</text>
    <text x="204" y="469" fill="#d8e3f3" font-size="16">
      <tspan x="204">the guard <tspan fill="#c4b5fd">`lo &lt; hi`</tspan> treats <tspan fill="#c4b5fd">`hi`</tspan> as an exclusive bound, but it is</tspan>
      <tspan x="204" dy="26">initialised to <tspan fill="#c4b5fd">`len(a) - 1`</tspan>, the last valid index</tspan>
    </text>

    <rect x="44" y="555" width="992" height="247" rx="14" fill="url(#card)" stroke="#284b67" filter="url(#shadow)"/>
    <rect x="44" y="577" width="3" height="203" rx="1.5" fill="#38bdf8"/>
    <rect x="72" y="573" width="36" height="30" rx="7" fill="#18344b" stroke="#315c7a"/>
    <text x="90" y="593" text-anchor="middle" fill="#a5e4ff" font-size="15" font-weight="700">02</text>
    <text x="126" y="595" fill="#b5ddff" font-size="20" font-weight="600">Knowledge-graph alignment</text>
    <path d="M966 582H995M966 594H995" stroke="#456b8d" stroke-width="1.5"/>
    <circle cx="963" cy="588" r="5" fill="#c4b5fd"/>
    <circle cx="999" cy="580" r="4" fill="#7dd3fc"/>
    <circle cx="999" cy="596" r="4" fill="#5eead4"/>
    <path d="M72 614H1008" stroke="#2c405b"/>
    <text x="72" y="647" fill="#8da5c5" font-size="15">root cause</text>
    <text x="224" y="647" font-size="18"><tspan fill="#c4b5fd" font-weight="600">Loop invariants</tspan><tspan fill="#526b8d">  ·  </tspan><tspan fill="#a7bad4" font-size="16">loop-invariant, depth </tspan><tspan fill="#93c5fd">4</tspan></text>
    <text x="72" y="680" fill="#b8c9df" font-size="16">the deepest implicated concept whose own prerequisites are already secure</text>
    <text x="72" y="715" fill="#8da5c5" font-size="13">learning path</text>
    <rect x="72" y="732" width="249" height="42" rx="9" fill="#2b2544" stroke="#594b7c"/>
    <text x="196.5" y="758" text-anchor="middle" fill="#d8c5ff" font-size="16">Loop invariants</text>
    <path d="M334 753H349m-5-5 5 5-5 5" stroke="#7693b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="363" y="732" width="281" height="42" rx="9" fill="#18344b" stroke="#315c7a"/>
    <text x="503.5" y="758" text-anchor="middle" fill="#a5e4ff" font-size="16">Half-open intervals</text>
    <path d="M657 753H672m-5-5 5 5-5 5" stroke="#7693b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="687" y="732" width="321" height="42" rx="9" fill="#163839" stroke="#30615d"/>
    <text x="847.5" y="758" text-anchor="middle" fill="#99f6e4" font-size="16">Boundary conditions</text>

    <rect x="44" y="822" width="992" height="592" rx="14" fill="url(#intervention)" stroke="#2c5a50" filter="url(#shadow)"/>
    <rect x="44" y="844" width="3" height="548" rx="1.5" fill="#5eead4"/>
    <rect x="72" y="840" width="36" height="30" rx="7" fill="#163d32" stroke="#327458"/>
    <text x="90" y="860" text-anchor="middle" fill="#a7f3c4" font-size="15" font-weight="700">03</text>
    <text x="126" y="862" fill="#baf4e3" font-size="20" font-weight="600">Cognitive intervention</text>
    <rect x="894" y="840" width="114" height="30" rx="7" fill="#163d32" stroke="#327458"/>
    <circle cx="910" cy="855" r="3" fill="#86efac"/>
    <text x="951" y="860" text-anchor="middle" fill="#a7f3c4" font-size="14" font-weight="700" letter-spacing="0.5">IN ZPD</text>
    <path d="M72 882H1008" stroke="#28483f"/>
    <text x="72" y="914" fill="#8da5c5" font-size="15">target</text>
    <text x="166" y="914" fill="#c4b5fd" font-size="18" font-weight="600">Loop invariants</text>
    <text x="644" y="914" fill="#a7bad4" font-size="15">success probability</text>
    <rect x="840" y="905" width="92" height="7" rx="3.5" fill="#28423f"/>
    <rect x="840" y="905" width="56.12" height="7" rx="3.5" fill="#5eead4"/>
    <text x="1008" y="914" text-anchor="end" fill="#99f6e4" font-size="18" font-weight="700">61%</text>

    <rect x="72" y="934" width="936" height="113" rx="10" fill="#1b2034" stroke="#49405f"/>
    <circle cx="99" cy="958" r="13" fill="#3e305e"/>
    <text x="99" y="963" text-anchor="middle" fill="#d8c5ff" font-size="14" font-weight="700">1</text>
    <text x="124" y="963" fill="#d8c5ff" font-size="16" font-weight="600">orienting</text>
    <text x="94" y="991" fill="#d8e3f3" font-size="17">
      <tspan x="94">Take the input <tspan fill="#fde68a">([0], 1)</tspan> and step through your own function by hand,</tspan>
      <tspan x="94" dy="26">writing down the values at <tspan fill="#c4b5fd">line 4</tspan> each time you reach it.</tspan>
    </text>

    <rect x="72" y="1063" width="936" height="139" rx="10" fill="#152a3a" stroke="#2f536c"/>
    <circle cx="99" cy="1087" r="13" fill="#23475f"/>
    <text x="99" y="1092" text-anchor="middle" fill="#a5e4ff" font-size="14" font-weight="700">2</text>
    <text x="124" y="1092" fill="#a5e4ff" font-size="16" font-weight="600">contradiction</text>
    <text x="94" y="1120" fill="#d8e3f3" font-size="17">
      <tspan x="94">At that point your <tspan fill="#c4b5fd">`hi`</tspan> holds <tspan fill="#fde68a">0</tspan>, but for the answer to be reachable it</tspan>
      <tspan x="94" dy="26">would have to be <tspan fill="#fde68a">1</tspan>. Which line last wrote <tspan fill="#c4b5fd">`hi`</tspan>, and what did you assume</tspan>
      <tspan x="94" dy="26">about the range it was allowed to take?</tspan>
    </text>

    <rect x="72" y="1218" width="936" height="113" rx="10" fill="#152e32" stroke="#305a55"/>
    <circle cx="99" cy="1242" r="13" fill="#235049"/>
    <text x="99" y="1247" text-anchor="middle" fill="#99f6e4" font-size="14" font-weight="700">3</text>
    <text x="124" y="1247" fill="#99f6e4" font-size="16" font-weight="600">conceptual</text>
    <text x="94" y="1275" fill="#d8e3f3" font-size="17">
      <tspan x="94">Write down the property you believe holds at the top of every iteration.</tspan>
      <tspan x="94" dy="26">Does it still hold immediately after your update lines run?</tspan>
    </text>

    <path d="M72 1352H1008" stroke="#28483f"/>
    <rect x="72" y="1369" width="267" height="28" rx="7" fill="#163d32" stroke="#327458"/>
    <text x="88" y="1388" fill="#a4c9b9" font-size="14">answer leakage <tspan fill="#a7f3c4" font-weight="700"> 0.00</tspan></text>
    <rect x="355" y="1369" width="218" height="28" rx="7" fill="#193342" stroke="#305467"/>
    <text x="371" y="1388" fill="#a7bad4" font-size="14">grounding <tspan fill="#a5e4ff" font-weight="700"> 0.55</tspan></text>
    <g transform="translate(899 1383)">
      <circle r="4" fill="#c4b5fd"/>
      <path d="M10 0H42M60 0H92" stroke="#4f8391" stroke-width="1.5"/>
      <circle cx="51" r="4" fill="#7dd3fc"/>
      <circle cx="101" r="4" fill="#5eead4"/>
    </g>
  </g>
</svg>
